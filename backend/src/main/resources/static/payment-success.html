<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful — My Tuck Shop</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="background:var(--bg-light);padding:0;">

  <nav class="navbar navbar-tuck">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="logo.png" alt="My Tuck Shop" style="height:38px;">
        <span class="navbar-brand-text">My Tuck Shop</span>
      </a>
    </div>
  </nav>

  <div style="min-height:90vh;display:flex;align-items:center;justify-content:center;padding:40px 16px;">
    <div class="success-card" id="successCard">
      <!-- Animated confetti circles -->
      <div style="position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent));border-radius:20px 20px 0 0;"></div>

      <div class="success-icon">✓</div>
      <h1 style="font-size:1.6rem;font-weight:800;margin-bottom:6px;">Payment Successful!</h1>
      <p style="color:var(--text-secondary);font-size:.9rem;margin-bottom:24px;">Your order has been confirmed. Come collect it soon!</p>

      <div class="token-badge" id="tokenBadge">TS-1001</div>
      <div style="font-size:.78rem;color:var(--text-secondary);margin-top:8px;">Your Order Token</div>

      <!-- Order details -->
      <div id="orderDetails" style="background:var(--bg-light);border-radius:var(--radius-md);padding:20px;margin-top:24px;text-align:left;">
        <div class="loading-spinner mx-auto mb-2" style="width:32px;height:32px;border-width:3px;"></div>
        <div style="text-align:center;font-size:.85rem;color:var(--text-secondary);">Loading order details…</div>
      </div>

      <!-- Pickup time -->
      <div id="pickupInfo" style="display:none;background:rgba(76,175,125,0.08);border:1.5px solid rgba(76,175,125,0.2);border-radius:var(--radius-md);padding:16px;margin-top:16px;text-align:center;">
        <i class="fas fa-clock" style="color:var(--accent);font-size:1.3rem;margin-bottom:8px;display:block;"></i>
        <div style="font-family:'Outfit',sans-serif;font-weight:700;font-size:1rem;color:var(--accent);">Ready in ~<span id="etaMinutes">10</span> minutes</div>
        <div style="font-size:.78rem;color:var(--text-secondary);margin-top:4px;">Show your order token at the counter</div>
      </div>

      <!-- Action buttons -->
      <div class="d-flex flex-column gap-3 mt-4">
        <a href="order-status.html" class="btn-primary-custom w-100 justify-content-center" id="trackLink">
          <i class="fas fa-receipt me-2"></i>Track This Order
        </a>
        <a href="menu.html" class="btn-outline-custom w-100 text-center">
          <i class="fas fa-utensils me-2"></i>Order More
        </a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const token  = params.get('token');
      const id     = params.get('id');

      const method = params.get('method') || 'CASH_ON_PICKUP';

      let methodBadge = '<span style="background:rgba(76,175,125,.15);color:var(--accent);font-weight:700;font-size:.78rem;padding:3px 10px;border-radius:100px;">✓ PAID ONLINE</span>';
      let methodNote  = 'Payment verified. Come collect your food!';

      if (method === 'CASH_ON_PICKUP') {
        methodBadge = '<span style="background:rgba(245,158,11,.15);color:#D97706;font-weight:700;font-size:.78rem;padding:3px 10px;border-radius:100px;">💵 PAY AT COUNTER</span>';
        methodNote  = 'Pay cash or UPI at the counter when picking up your order.';
      } else if (method === 'UPI_QR') {
        methodBadge = '<span style="background:rgba(59,130,246,.15);color:#2563EB;font-weight:700;font-size:.78rem;padding:3px 10px;border-radius:100px;">📱 DIRECT UPI</span>';
        methodNote  = 'Show your UPI transaction confirmation at the counter.';
      }

      if (token) {
        document.getElementById('tokenBadge').textContent = token;
        const trackLink = document.getElementById('trackLink');
        trackLink.href = `order-status.html?token=${encodeURIComponent(token)}`;
      }

      if (id || token) {
        document.getElementById('orderDetails').innerHTML = `
          <div style="display:flex;flex-direction:column;gap:12px;">
            <div style="display:flex;justify-content:space-between;font-size:.88rem;">
              <span style="color:var(--text-secondary);">Order Token</span>
              <strong style="color:var(--primary);">${token}</strong>
            </div>
            <div style="display:flex;justify-content:space-between;font-size:.88rem;">
              <span style="color:var(--text-secondary);">Payment Method</span>
              ${methodBadge}
            </div>
            <div style="display:flex;justify-content:space-between;font-size:.88rem;">
              <span style="color:var(--text-secondary);">Order Status</span>
              <span style="background:rgba(59,130,246,.12);color:#3B82F6;font-weight:700;font-size:.78rem;padding:3px 10px;border-radius:100px;">CONFIRMED</span>
            </div>
            <div style="border-top:1.5px dashed var(--border);padding-top:12px;text-align:center;font-size:.78rem;color:var(--text-secondary);">
              <i class="fas fa-info-circle me-1"></i>${methodNote}
            </div>
          </div>`;
        document.getElementById('pickupInfo').style.display='block';
      }
    });
  </script>
</body>
</html>
