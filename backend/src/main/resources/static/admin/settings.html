<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — My Tuck Shop Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="../logo.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <aside class="admin-sidebar" id="adminSidebar">
    <a href="dashboard.html" class="sidebar-brand">
      <img src="../logo.png" alt="logo">
      <div><span class="sidebar-brand-text">My Tuck Shop</span><span class="sidebar-brand-sub">Admin Panel</span></div>
    </a>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Main</div>
      <a href="dashboard.html" class="sidebar-link"><i class="fas fa-tachometer-alt"></i>Dashboard</a>
      <a href="orders.html"    class="sidebar-link"><i class="fas fa-receipt"></i>Orders</a>
      <a href="products.html"  class="sidebar-link"><i class="fas fa-box-open"></i>Products</a>
      <div class="sidebar-section-label">Management</div>
      <a href="coupons.html"   class="sidebar-link"><i class="fas fa-tag"></i>Coupons</a>
      <a href="settings.html"  class="sidebar-link active"><i class="fas fa-cog"></i>Settings</a>
      <a href="audit.html"     class="sidebar-link"><i class="fas fa-clipboard-list"></i>Audit Logs</a>
      <div class="sidebar-section-label">Links</div>
      <a href="../menu.html"   class="sidebar-link" target="_blank"><i class="fas fa-store"></i>View Shop</a>
    </nav>
    <div class="sidebar-footer">
      <button class="admin-btn admin-btn-secondary w-100" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i>Logout</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="admin-btn admin-btn-secondary admin-btn-icon sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <span class="topbar-title">Shop Settings</span>
      </div>
      <div class="topbar-right"><div class="topbar-avatar"><span id="adminInitial">A</span></div></div>
    </div>

    <div class="admin-content" style="max-width:780px;">

      <!-- Shop Hours -->
      <div class="chart-card mb-4">
        <div class="chart-title mb-4">🕐 Shop Hours</div>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="admin-form-label">Opening Time</label>
            <input type="time" class="admin-input" id="openingTime" value="08:00">
          </div>
          <div class="col-md-6">
            <label class="admin-form-label">Closing Time</label>
            <input type="time" class="admin-input" id="closingTime" value="20:00">
          </div>
        </div>
      </div>

      <!-- Order Settings -->
      <div class="chart-card mb-4">
        <div class="chart-title mb-4">📦 Order Settings</div>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="admin-form-label">Daily Order Limit</label>
            <input type="number" class="admin-input" id="dailyOrderLimit" placeholder="e.g. 200" min="1">
          </div>
          <div class="col-md-6">
            <label class="admin-form-label">Estimated Prep Time (minutes)</label>
            <input type="number" class="admin-input" id="estimatedPrepMins" placeholder="e.g. 10" min="1">
          </div>
          <div class="col-md-6">
            <label class="admin-form-label">Minimum Order Amount (₹)</label>
            <input type="number" class="admin-input" id="minOrderAmount" placeholder="e.g. 20" min="0">
          </div>
          <div class="col-md-6">
            <label class="admin-form-label">Maximum Order Amount (₹)</label>
            <input type="number" class="admin-input" id="maxOrderAmount" placeholder="e.g. 2000" min="0">
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-3">
        <button class="admin-btn admin-btn-secondary" onclick="loadSettings()"><i class="fas fa-undo me-1"></i>Reset</button>
        <button class="admin-btn admin-btn-primary" onclick="saveSettings()"><i class="fas fa-save me-1"></i>Save Settings</button>
      </div>
    </div>
  </main>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="admin-toast-container" id="adminToastContainer"></div>

  <script src="../js/api.js"></script>
  <script src="admin.js"></script>
  <script>
    requireAuth();
    const u = JSON.parse(sessionStorage.getItem('admin_user')||'{}');
    if(u.username) document.getElementById('adminInitial').textContent=u.username[0].toUpperCase();

    const DEFAULTS = { openingTime:'08:00', closingTime:'20:00', dailyOrderLimit:200, estimatedPreparationMinutes:10, minOrderAmount:20, maxOrderAmount:2000 };

    async function loadSettings() {
      try {
        const s = await Api.adminGetSettings();
        applySettings(s);
      } catch { applySettings(DEFAULTS); }
    }

    function applySettings(s) {
      document.getElementById('openingTime').value        = s.openingTime||DEFAULTS.openingTime;
      document.getElementById('closingTime').value        = s.closingTime||DEFAULTS.closingTime;
      document.getElementById('dailyOrderLimit').value    = s.dailyOrderLimit||DEFAULTS.dailyOrderLimit;
      document.getElementById('estimatedPrepMins').value  = s.estimatedPreparationMinutes||DEFAULTS.estimatedPreparationMinutes;
      document.getElementById('minOrderAmount').value     = s.minOrderAmount||DEFAULTS.minOrderAmount;
      document.getElementById('maxOrderAmount').value     = s.maxOrderAmount||DEFAULTS.maxOrderAmount;
    }

    async function saveSettings() {
      const body = {
        openingTime:                 document.getElementById('openingTime').value,
        closingTime:                 document.getElementById('closingTime').value,
        dailyOrderLimit:             parseInt(document.getElementById('dailyOrderLimit').value)||200,
        estimatedPreparationMinutes: parseInt(document.getElementById('estimatedPrepMins').value)||10,
        minOrderAmount:              parseFloat(document.getElementById('minOrderAmount').value)||0,
        maxOrderAmount:              parseFloat(document.getElementById('maxOrderAmount').value)||9999,
      };
      try {
        await Api.adminSaveSettings(body);
        adminToast('Settings saved successfully','success');
      } catch(e) { adminToast(e.message||'Could not save settings','error'); }
    }

    loadSettings();
  </script>
</body>
</html>
