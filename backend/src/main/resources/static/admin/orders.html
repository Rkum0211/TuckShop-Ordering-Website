<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders — My Tuck Shop Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="../logo.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <!-- SIDEBAR -->
  <aside class="admin-sidebar" id="adminSidebar">
    <a href="dashboard.html" class="sidebar-brand">
      <img src="../logo.png" alt="logo">
      <div><span class="sidebar-brand-text">My Tuck Shop</span><span class="sidebar-brand-sub">Admin Panel</span></div>
    </a>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Main</div>
      <a href="dashboard.html" class="sidebar-link"><i class="fas fa-tachometer-alt"></i>Dashboard</a>
      <a href="orders.html"    class="sidebar-link active"><i class="fas fa-receipt"></i>Orders</a>
      <a href="products.html"  class="sidebar-link"><i class="fas fa-box-open"></i>Products</a>
      <div class="sidebar-section-label">Management</div>
      <a href="coupons.html"   class="sidebar-link"><i class="fas fa-tag"></i>Coupons</a>
      <a href="settings.html"  class="sidebar-link"><i class="fas fa-cog"></i>Settings</a>
      <a href="audit.html"     class="sidebar-link"><i class="fas fa-clipboard-list"></i>Audit Logs</a>
      <div class="sidebar-section-label">Links</div>
      <a href="../menu.html"   class="sidebar-link" target="_blank"><i class="fas fa-store"></i>View Shop</a>
    </nav>
    <div class="sidebar-footer">
      <button class="admin-btn admin-btn-secondary w-100" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i>Logout</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="admin-main">
    <div class="admin-topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="admin-btn admin-btn-secondary admin-btn-icon sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <span class="topbar-title">Orders</span>
      </div>
      <div class="topbar-right">
        <div class="topbar-avatar"><span id="adminInitial">A</span></div>
      </div>
    </div>

    <div class="admin-content">
      <!-- Filters -->
      <div class="admin-table-card mb-4" style="padding:16px 20px;">
        <div class="d-flex flex-wrap gap-3 align-items-center">
          <div class="admin-search">
            <i class="fas fa-search"></i>
            <input type="text" id="searchOrders" placeholder="Token or name…" oninput="debounceSearch()">
          </div>
          <select class="admin-select" id="statusFilter" onchange="loadOrders()" style="width:160px;">
            <option value="">All Statuses</option>
            <option>PENDING</option><option>CONFIRMED</option><option>PREPARING</option>
            <option>READY_FOR_PICKUP</option><option>COMPLETED</option><option>CANCELLED</option>
          </select>
          <select class="admin-select" id="payFilter" onchange="loadOrders()" style="width:140px;">
            <option value="">All Payments</option>
            <option>PAID</option><option>PENDING</option><option>FAILED</option><option>REFUNDED</option>
          </select>
          <button class="admin-btn admin-btn-secondary" onclick="loadOrders()"><i class="fas fa-sync-alt me-1"></i>Refresh</button>
        </div>
      </div>

      <!-- Table -->
      <div class="admin-table-card">
        <div style="overflow-x:auto;">
          <table class="admin-table">
            <thead>
              <tr><th>Token</th><th>Customer</th><th>Items</th><th>Amount</th><th>Status</th><th>Payment</th><th>Pickup</th><th>Time</th><th>Actions</th></tr>
            </thead>
            <tbody id="ordersTbody">
              <tr><td colspan="9" style="text-align:center;padding:40px;color:var(--admin-muted);"><div class="spinner-border spinner-border-sm"></div> Loading…</td></tr>
            </tbody>
          </table>
        </div>
        <div class="admin-pagination" id="ordersPage"></div>
      </div>
    </div>
  </main>

  <!-- Order Detail Modal -->
  <div class="admin-modal-overlay" id="orderModal">
    <div class="admin-modal" style="max-width:640px;">
      <div class="admin-modal-header">
        <div class="admin-modal-title" id="modalOrderTitle">Order Details</div>
        <button class="admin-modal-close" onclick="closeModal('orderModal')">×</button>
      </div>
      <div class="admin-modal-body" id="orderModalBody">Loading…</div>
      <div class="admin-modal-footer" id="orderModalFooter"></div>
    </div>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="admin-toast-container" id="adminToastContainer"></div>

  <script src="../js/api.js"></script>
  <script src="admin.js"></script>
  <script>
    requireAuth();
    let currentPage=0, totalPages=0, searchTimer=null;
    const u = JSON.parse(sessionStorage.getItem('admin_user')||'{}');
    if(u.username) document.getElementById('adminInitial').textContent=u.username[0].toUpperCase();

    // Demo fallback data
    const DEMO_ORDERS = [
      { id:1, tokenNumber:'TS-1001', customerName:'Rahul Kumar',  phoneNumber:'9876543210', pickupLocation:'Room 204', items:[{productName:'Samosa',quantity:2,totalPrice:30},{productName:'Frooti',quantity:1,totalPrice:20}], totalAmount:50,  orderStatus:'CONFIRMED',  paymentStatus:'PAID',    razorpayPaymentId:'pay_123', createdAt:new Date(Date.now()-300000).toISOString() },
      { id:2, tokenNumber:'TS-1002', customerName:'Priya Singh',  phoneNumber:'9812345678', pickupLocation:'Table 5',  items:[{productName:'Cold Coffee',quantity:1,totalPrice:40}],                                          totalAmount:40,  orderStatus:'PREPARING',  paymentStatus:'PAID',    razorpayPaymentId:'pay_124', createdAt:new Date(Date.now()-600000).toISOString() },
      { id:3, tokenNumber:'TS-1003', customerName:'Amit Sharma',  phoneNumber:'9900112233', pickupLocation:'Block B',  items:[{productName:'Dairy Milk',quantity:2,totalPrice:120},{productName:'Chips',quantity:1,totalPrice:25}], totalAmount:145, orderStatus:'READY_FOR_PICKUP', paymentStatus:'PAID', razorpayPaymentId:'pay_125', createdAt:new Date(Date.now()-900000).toISOString() },
      { id:4, tokenNumber:'TS-1004', customerName:'Sneha Patel',  phoneNumber:'9811223344', pickupLocation:'Library',  items:[{productName:'Notebook',quantity:1,totalPrice:70},{productName:'Pen pack',quantity:1,totalPrice:25}], totalAmount:95,  orderStatus:'PENDING',    paymentStatus:'PAID',    razorpayPaymentId:'pay_126', createdAt:new Date(Date.now()-60000).toISOString() },
      { id:5, tokenNumber:'TS-1005', customerName:'Vijay Nair',   phoneNumber:'9922334455', pickupLocation:'Room 101', items:[{productName:'Muffin',quantity:3,totalPrice:90}],                                                totalAmount:90,  orderStatus:'COMPLETED',  paymentStatus:'PAID',    razorpayPaymentId:'pay_127', createdAt:new Date(Date.now()-7200000).toISOString() },
      { id:6, tokenNumber:'TS-1006', customerName:'Anjali Gupta', phoneNumber:'9933445566', pickupLocation:'Canteen',  items:[{productName:'KitKat',quantity:2,totalPrice:60},{productName:'Wafer',quantity:2,totalPrice:36}],  totalAmount:96,  orderStatus:'CANCELLED',  paymentStatus:'REFUNDED',null, createdAt:new Date(Date.now()-10800000).toISOString() },
    ];

    async function loadOrders(page=0) {
      currentPage = page;
      const status  = document.getElementById('statusFilter').value;
      const payment = document.getElementById('payFilter').value;
      const search  = document.getElementById('searchOrders').value.trim();
      let params = `?page=${page}&size=20`;
      if (status)  params+=`&status=${status}`;
      if (payment) params+=`&paymentStatus=${payment}`;
      if (search)  params+=`&search=${encodeURIComponent(search)}`;

      try {
        const data = await Api.adminOrders(params);
        const orders = data.content || data;
        totalPages   = data.totalPages || 1;
        renderOrders(orders);
        renderPagination();
      } catch {
        renderOrders(DEMO_ORDERS);
        totalPages = 1;
        renderPagination();
      }
    }

    function renderOrders(orders) {
      if (!orders.length) {
        document.getElementById('ordersTbody').innerHTML = `<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--admin-muted);font-size:.85rem;"><i class="fas fa-search me-2"></i>No orders found</td></tr>`;
        return;
      }
      document.getElementById('ordersTbody').innerHTML = orders.map(o=>`
        <tr>
          <td><strong style="color:#FF6B35;">${o.tokenNumber}</strong></td>
          <td><div style="font-weight:600;">${o.customerName}</div><div style="color:var(--admin-muted);font-size:.78rem;">${o.phoneNumber}</div></td>
          <td style="font-size:.82rem;">${(o.items||[]).map(i=>`${i.productName}×${i.quantity}`).join(', ')}</td>
          <td style="font-weight:700;">${fINR(o.totalAmount)}</td>
          <td>${orderPill(o.orderStatus)}</td>
          <td>${paymentPill(o.paymentStatus)}</td>
          <td style="font-size:.82rem;">${o.pickupLocation||'—'}</td>
          <td style="color:var(--admin-muted);font-size:.78rem;">${fDate(o.createdAt)}</td>
          <td>
            <div class="d-flex gap-1">
              <button class="admin-btn admin-btn-sm admin-btn-secondary" onclick="viewOrder(${o.id})"><i class="fas fa-eye"></i></button>
              <select class="admin-select admin-btn-sm" style="width:auto;padding:5px 10px;font-size:.75rem;" onchange="updateStatus(${o.id},this.value,this)">
                <option value="">Status…</option>
                <option>CONFIRMED</option><option>PREPARING</option>
                <option>READY_FOR_PICKUP</option><option>COMPLETED</option><option>CANCELLED</option>
              </select>
            </div>
          </td>
        </tr>`).join('');
    }

    function renderPagination() {
      const el = document.getElementById('ordersPage');
      let html = '';
      for(let i=0;i<totalPages;i++) html+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="loadOrders(${i})">${i+1}</button>`;
      html+=`<span class="page-info">Page ${currentPage+1} of ${totalPages}</span>`;
      el.innerHTML = html;
    }

    async function viewOrder(id) {
      document.getElementById('orderModal').classList.add('open');
      document.getElementById('orderModalBody').innerHTML='<div style="text-align:center;padding:30px;"><div class="spinner-border"></div></div>';
      document.getElementById('orderModalFooter').innerHTML='';
      try {
        const o = await Api.adminOrder(id);
        showOrderModal(o);
      } catch {
        const o = DEMO_ORDERS.find(d=>d.id===id);
        if(o) showOrderModal(o); else document.getElementById('orderModalBody').innerHTML='<p style="color:#EF4444;">Could not load order</p>';
      }
    }

    function showOrderModal(o) {
      document.getElementById('modalOrderTitle').textContent = `Order ${o.tokenNumber}`;
      document.getElementById('orderModalBody').innerHTML = `
        <div class="row g-3">
          <div class="col-6"><div class="admin-form-label">Token</div><div style="font-weight:700;color:#FF6B35;">${o.tokenNumber}</div></div>
          <div class="col-6"><div class="admin-form-label">Status</div>${orderPill(o.orderStatus)}</div>
          <div class="col-6"><div class="admin-form-label">Customer</div><div>${o.customerName}</div></div>
          <div class="col-6"><div class="admin-form-label">Phone</div><div>${o.phoneNumber}</div></div>
          <div class="col-12"><div class="admin-form-label">Pickup Location</div><div>${o.pickupLocation}</div></div>
          ${o.notes?`<div class="col-12"><div class="admin-form-label">Notes</div><div style="font-style:italic;">${o.notes}</div></div>`:''}
          <div class="col-12" style="border-top:1px solid rgba(255,255,255,.06);padding-top:16px;">
            <div class="admin-form-label">Items</div>
            ${(o.items||[]).map(i=>`<div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:.88rem;">
              <span>${i.productName} × ${i.quantity}</span><strong>${fINR(i.totalPrice)}</strong></div>`).join('')}
            <div style="border-top:1px dashed rgba(255,255,255,.08);padding-top:10px;display:flex;justify-content:space-between;font-weight:800;color:#FF6B35;">
              <span>Total</span><span>${fINR(o.totalAmount)}</span></div>
          </div>
          <div class="col-6"><div class="admin-form-label">Payment</div>${paymentPill(o.paymentStatus)}</div>
          <div class="col-6"><div class="admin-form-label">Payment ID</div><div style="font-size:.78rem;color:var(--admin-muted);">${o.razorpayPaymentId||'—'}</div></div>
          <div class="col-12"><div class="admin-form-label">Update Status</div>
            <select class="admin-select" id="modalStatusSel">
              ${['CONFIRMED','PREPARING','READY_FOR_PICKUP','COMPLETED','CANCELLED'].map(s=>`<option ${o.orderStatus===s?'selected':''}>${s}</option>`).join('')}
            </select>
          </div>
        </div>`;
      document.getElementById('orderModalFooter').innerHTML = `
        <button class="admin-btn admin-btn-secondary" onclick="closeModal('orderModal')">Close</button>
        ${o.paymentStatus==='PAID'&&o.orderStatus!=='REFUNDED'?`<button class="admin-btn admin-btn-danger" onclick="doRefund(${o.id})"><i class="fas fa-undo me-1"></i>Refund</button>`:''}
        <button class="admin-btn admin-btn-primary" onclick="updateStatus(${o.id},document.getElementById('modalStatusSel').value)"><i class="fas fa-save me-1"></i>Update Status</button>`;
    }

    async function updateStatus(id, status, sel) {
      if (!status) return;
      try {
        await Api.adminUpdateStatus(id, { orderStatus: status });
        adminToast(`Status updated to ${status.replace(/_/g,' ')}`, 'success');
        loadOrders(currentPage);
        closeModal('orderModal');
      } catch(e) { adminToast(e.message||'Update failed','error'); }
      if(sel) sel.value='';
    }

    async function doRefund(id) {
      if (!confirm('Initiate refund for this order?')) return;
      try {
        await Api.adminRefund(id);
        adminToast('Refund initiated successfully','success');
        closeModal('orderModal');
        loadOrders(currentPage);
      } catch(e) { adminToast(e.message||'Refund failed','error'); }
    }

    function closeModal(id) { document.getElementById(id).classList.remove('open'); }

    let debounceTimer=null;
    function debounceSearch() { clearTimeout(debounceTimer); debounceTimer=setTimeout(()=>loadOrders(0),400); }

    // Pre-select order from URL
    document.addEventListener('DOMContentLoaded',()=>{
      const p = new URLSearchParams(window.location.search);
      if(p.get('id')) setTimeout(()=>viewOrder(parseInt(p.get('id'))),600);
    });

    loadOrders();
  </script>
</body>
</html>
