<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coupons — My Tuck Shop Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="../logo.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <aside class="admin-sidebar" id="adminSidebar">
    <a href="dashboard.html" class="sidebar-brand">
      <img src="../logo.png" alt="logo">
      <div><span class="sidebar-brand-text">My Tuck Shop</span><span class="sidebar-brand-sub">Admin Panel</span></div>
    </a>
    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Main</div>
      <a href="dashboard.html" class="sidebar-link"><i class="fas fa-tachometer-alt"></i>Dashboard</a>
      <a href="orders.html"    class="sidebar-link"><i class="fas fa-receipt"></i>Orders</a>
      <a href="products.html"  class="sidebar-link"><i class="fas fa-box-open"></i>Products</a>
      <div class="sidebar-section-label">Management</div>
      <a href="coupons.html"   class="sidebar-link active"><i class="fas fa-tag"></i>Coupons</a>
      <a href="settings.html"  class="sidebar-link"><i class="fas fa-cog"></i>Settings</a>
      <a href="audit.html"     class="sidebar-link"><i class="fas fa-clipboard-list"></i>Audit Logs</a>
      <div class="sidebar-section-label">Links</div>
      <a href="../menu.html"   class="sidebar-link" target="_blank"><i class="fas fa-store"></i>View Shop</a>
    </nav>
    <div class="sidebar-footer">
      <button class="admin-btn admin-btn-secondary w-100" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i>Logout</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="admin-btn admin-btn-secondary admin-btn-icon sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <span class="topbar-title">Coupons</span>
      </div>
      <div class="topbar-right">
        <button class="admin-btn admin-btn-primary" onclick="openAddCoupon()"><i class="fas fa-plus me-1"></i>Add Coupon</button>
        <div class="topbar-avatar"><span id="adminInitial">A</span></div>
      </div>
    </div>

    <div class="admin-content">
      <div class="admin-table-card">
        <div style="overflow-x:auto;">
          <table class="admin-table">
            <thead>
              <tr><th>Code</th><th>Type</th><th>Value</th><th>Min Order</th><th>Max Disc</th><th>Expiry</th><th>Active</th><th>Actions</th></tr>
            </thead>
            <tbody id="couponsTbody">
              <tr><td colspan="8" style="text-align:center;padding:40px;"><div class="spinner-border spinner-border-sm"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Coupon Modal -->
  <div class="admin-modal-overlay" id="couponModal">
    <div class="admin-modal">
      <div class="admin-modal-header">
        <div class="admin-modal-title" id="couponModalTitle">Add Coupon</div>
        <button class="admin-modal-close" onclick="closeModal('couponModal')">×</button>
      </div>
      <div class="admin-modal-body">
        <input type="hidden" id="couponId">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="admin-form-label">Coupon Code *</label>
            <input type="text" class="admin-input" id="couponCode" placeholder="e.g. SAVE20" maxlength="20" style="text-transform:uppercase;" oninput="this.value=this.value.toUpperCase()">
          </div>
          <div class="col-md-6">
            <label class="admin-form-label">Discount Type *</label>
            <select class="admin-select" id="couponType">
              <option value="PERCENTAGE">Percentage (%)</option>
              <option value="FIXED">Fixed Amount (₹)</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="admin-form-label">Discount Value *</label>
            <input type="number" class="admin-input" id="couponValue" placeholder="e.g. 20 for 20%" min="1">
          </div>
          <div class="col-md-6">
            <label class="admin-form-label">Minimum Order Amount (₹)</label>
            <input type="number" class="admin-input" id="couponMinOrder" placeholder="e.g. 100" min="0">
          </div>
          <div class="col-md-6">
            <label class="admin-form-label">Maximum Discount (₹)</label>
            <input type="number" class="admin-input" id="couponMaxDisc" placeholder="e.g. 50" min="0">
          </div>
          <div class="col-md-6">
            <label class="admin-form-label">Expiry Date</label>
            <input type="date" class="admin-input" id="couponExpiry">
          </div>
          <div class="col-12">
            <label class="admin-form-label">Active</label>
            <select class="admin-select" id="couponActive"><option value="true">Yes</option><option value="false">No</option></select>
          </div>
        </div>
      </div>
      <div class="admin-modal-footer">
        <button class="admin-btn admin-btn-secondary" onclick="closeModal('couponModal')">Cancel</button>
        <button class="admin-btn admin-btn-primary" onclick="saveCoupon()"><i class="fas fa-save me-1"></i>Save</button>
      </div>
    </div>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="admin-toast-container" id="adminToastContainer"></div>

  <script src="../js/api.js"></script>
  <script src="admin.js"></script>
  <script>
    requireAuth();
    const u = JSON.parse(sessionStorage.getItem('admin_user')||'{}');
    if(u.username) document.getElementById('adminInitial').textContent=u.username[0].toUpperCase();

    const DEMO_COUPONS = [
      { id:1, code:'SAVE20',   discountType:'PERCENTAGE', discountValue:20, minimumOrderAmount:100, maximumDiscount:50, expiryDate:'2025-12-31', active:true },
      { id:2, code:'FLAT50',   discountType:'FIXED',      discountValue:50, minimumOrderAmount:200, maximumDiscount:50, expiryDate:'2025-10-01', active:true },
      { id:3, code:'WELCOME10',discountType:'PERCENTAGE', discountValue:10, minimumOrderAmount:50,  maximumDiscount:30, expiryDate:'2025-09-30', active:false },
    ];

    async function loadCoupons() {
      try {
        const data = await Api.adminGetCoupons();
        renderCoupons(data);
      } catch { renderCoupons(DEMO_COUPONS); }
    }

    function renderCoupons(coupons) {
      if(!coupons.length) {
        document.getElementById('couponsTbody').innerHTML=`<tr><td colspan="8" style="text-align:center;padding:40px;color:var(--admin-muted);">No coupons found</td></tr>`;
        return;
      }
      document.getElementById('couponsTbody').innerHTML=coupons.map(c=>`
        <tr>
          <td><strong style="color:#FF6B35;letter-spacing:1px;">${c.code}</strong></td>
          <td><span class="status-pill pill-confirmed">${c.discountType}</span></td>
          <td style="font-weight:700;">${c.discountType==='PERCENTAGE'?`${c.discountValue}%`:`₹${c.discountValue}`}</td>
          <td>${c.minimumOrderAmount?`₹${c.minimumOrderAmount}`:'—'}</td>
          <td>${c.maximumDiscount?`₹${c.maximumDiscount}`:'—'}</td>
          <td style="color:var(--admin-muted);font-size:.82rem;">${c.expiryDate||'No expiry'}</td>
          <td><span class="status-pill ${c.active?'pill-active':'pill-inactive'}">${c.active?'Active':'Inactive'}</span></td>
          <td>
            <div class="d-flex gap-1">
              <button class="admin-btn admin-btn-sm admin-btn-secondary" onclick='editCoupon(${JSON.stringify(c)})'><i class="fas fa-edit"></i></button>
              <button class="admin-btn admin-btn-sm admin-btn-danger" onclick="deleteCoupon(${c.id})"><i class="fas fa-trash"></i></button>
            </div>
          </td>
        </tr>`).join('');
    }

    function openAddCoupon() {
      document.getElementById('couponModalTitle').textContent='Add Coupon';
      ['couponId','couponCode','couponValue','couponMinOrder','couponMaxDisc','couponExpiry'].forEach(id=>document.getElementById(id).value='');
      document.getElementById('couponType').value='PERCENTAGE';
      document.getElementById('couponActive').value='true';
      document.getElementById('couponModal').classList.add('open');
    }

    function editCoupon(c) {
      document.getElementById('couponModalTitle').textContent='Edit Coupon';
      document.getElementById('couponId').value       = c.id;
      document.getElementById('couponCode').value     = c.code;
      document.getElementById('couponType').value     = c.discountType;
      document.getElementById('couponValue').value    = c.discountValue;
      document.getElementById('couponMinOrder').value = c.minimumOrderAmount||'';
      document.getElementById('couponMaxDisc').value  = c.maximumDiscount||'';
      document.getElementById('couponExpiry').value   = c.expiryDate||'';
      document.getElementById('couponActive').value   = c.active?'true':'false';
      document.getElementById('couponModal').classList.add('open');
    }

    async function saveCoupon() {
      const id   = document.getElementById('couponId').value;
      const body = {
        code:              document.getElementById('couponCode').value.trim().toUpperCase(),
        discountType:      document.getElementById('couponType').value,
        discountValue:     parseFloat(document.getElementById('couponValue').value),
        minimumOrderAmount:parseFloat(document.getElementById('couponMinOrder').value)||0,
        maximumDiscount:   parseFloat(document.getElementById('couponMaxDisc').value)||null,
        expiryDate:        document.getElementById('couponExpiry').value||null,
        active:            document.getElementById('couponActive').value==='true',
      };
      if(!body.code||!body.discountValue) { adminToast('Fill required fields','warning'); return; }
      try {
        if(id) { await Api.adminUpdateCoupon(id,body); adminToast('Coupon updated','success'); }
        else   { await Api.adminAddCoupon(body);       adminToast('Coupon created','success'); }
        closeModal('couponModal');
        loadCoupons();
      } catch(e) { adminToast(e.message||'Save failed','error'); }
    }

    async function deleteCoupon(id) {
      if(!confirm('Delete this coupon?')) return;
      try { await Api.adminDeleteCoupon(id); adminToast('Coupon deleted','success'); loadCoupons(); }
      catch(e) { adminToast(e.message||'Delete failed','error'); }
    }

    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    loadCoupons();
  </script>
</body>
</html>
